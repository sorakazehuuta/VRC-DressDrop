<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRC-DressDrop Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.0/umd/index.js"></script>

    <style>
        body {
            font-family: sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #preview {
            width: 100%;
            height: 400px;
            background: #333;
            margin: 20px 0;
            border-radius: 8px;
            overflow: hidden;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

            button:hover {
                background: #333;
            }

        input[type="file"] {
            margin-bottom: 10px;
        }

        .controls {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
            display: none;
        }

            .controls label {
                display: block;
                margin-bottom: 10px;
                font-size: 14px;
                font-weight: bold;
                color: #333;
            }

            .controls input[type="range"] {
                width: 100%;
                margin-top: 5px;
                cursor: pointer;
            }

        .val-display {
            float: right;
            color: #007bff;
        }

        .color-picker-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }

        input[type="color"] {
            cursor: pointer;
            border: none;
            width: 50px;
            height: 30px;
            background: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>VRC-DressDrop プレビュー版</h2>

        <p>1. テクスチャ画像(PNG透過対応)を選択してね</p>
        <input type="file" id="imageUpload" accept="image/png, image/jpeg">

        <div class="controls" id="textureControls">
            <div class="color-picker-wrap">
                <label style="margin-bottom: 0;">Tシャツの生地色 (Base Color):</label>
                <input type="color" id="baseColor" value="#ffffff">
            </div>

            <p style="margin-top: 0; padding-bottom: 5px;">プリント調整 (Tiling / Offset)</p>
            <label>
                サイズ横 (Scale X): <span class="val-display" id="valScaleX">1.0</span>
                <input type="range" id="scaleX" min="0.1" max="5" step="0.1" value="1">
            </label>
            <label>
                サイズ縦 (Scale Y): <span class="val-display" id="valScaleY">1.0</span>
                <input type="range" id="scaleY" min="0.1" max="5" step="0.1" value="1">
            </label>
            <label>
                位置横 (Offset X): <span class="val-display" id="valOffsetX">0.00</span>
                <input type="range" id="offsetX" min="-2" max="2" step="0.01" value="0">
            </label>
            <label>
                位置縦 (Offset Y): <span class="val-display" id="valOffsetY">0.00</span>
                <input type="range" id="offsetY" min="-2" max="2" step="0.01" value="0">
            </label>
        </div>

        <div id="preview"></div>

        <p>2. UnityPackageを生成</p>
        <button id="downloadBtn">ダウンロード</button>
    </div>

    <script>
        const container = document.getElementById('preview');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(1, 1, 2);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x888888));
        camera.position.set(0, 0, 2);

        let matPrint = null;
        let matBase = null;
        let currentTexture = null;

        const model = new THREE.Object3D();
        scene.add(model);

        const loader = new THREE.GLTFLoader();
        loader.load('./Tshirt.glb', function (gltf) {
            const mesh = gltf.scene;
            mesh.scale.set(5, 5, 5);
            mesh.position.set(0, -0.5, 0);

            mesh.traverse((child) => {
                if (child.isMesh) {
                    if (child.material.name === 'Mat_Print' || child.material.name.includes('Print')) {
                        matPrint = child.material;
                        matPrint.color.setHex(0xffffff);
                        // ★追加: プレビュー上でも透過を有効にする
                        matPrint.transparent = true;
                        matPrint.alphaTest = 0.1; // 完全に透明な部分を切り抜く
                    } else if (child.material.name === 'Mat_Base' || child.material.name.includes('Base')) {
                        matBase = child.material;
                        matBase.color.setHex(0xffffff);
                    } else {
                        if (!matPrint) matPrint = child.material;
                    }
                }
            });
            model.add(mesh);
        });

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        document.getElementById('baseColor').addEventListener('input', (e) => {
            if (matBase) {
                matBase.color.set(e.target.value);
            }
        });

        const updateTextureTransform = () => {
            if (!currentTexture) return;
            const sX = parseFloat(document.getElementById('scaleX').value);
            const sY = parseFloat(document.getElementById('scaleY').value);
            const oX = parseFloat(document.getElementById('offsetX').value);
            const oY = parseFloat(document.getElementById('offsetY').value);

            document.getElementById('valScaleX').innerText = sX.toFixed(1);
            document.getElementById('valScaleY').innerText = sY.toFixed(1);
            document.getElementById('valOffsetX').innerText = oX.toFixed(2);
            document.getElementById('valOffsetY').innerText = oY.toFixed(2);

            currentTexture.repeat.set(sX, sY);
            currentTexture.offset.set(oX, oY);
        };

        ['scaleX', 'scaleY', 'offsetX', 'offsetY'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateTextureTransform);
        });

        let uploadedImageDataUrl = null;
        document.getElementById('imageUpload').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (event) {
                uploadedImageDataUrl = event.target.result;
                const texLoader = new THREE.TextureLoader();
                texLoader.load(uploadedImageDataUrl, (texture) => {
                    texture.flipY = false;
                    texture.wrapS = THREE.RepeatWrapping;
                    texture.wrapT = THREE.RepeatWrapping;

                    currentTexture = texture;

                    if (matPrint) {
                        matPrint.map = texture;
                        matPrint.needsUpdate = true;
                    }

                    document.getElementById('textureControls').style.display = 'block';
                    updateTextureTransform();
                });
            };
            reader.readAsDataURL(file);
        });

        function createTar(files) {
            let blocks = 0;
            for (let f of files) blocks += 1 + Math.ceil(f.data.length / 512);
            blocks += 2;
            const tar = new Uint8Array(blocks * 512);
            let offset = 0;
            for (let f of files) {
                const header = new Uint8Array(512);
                header.set(new TextEncoder().encode(f.name).slice(0, 100), 0);
                header.set(new TextEncoder().encode("0000777\0"), 100);
                header.set(new TextEncoder().encode("0000000\0"), 108);
                header.set(new TextEncoder().encode("0000000\0"), 116);
                header.set(new TextEncoder().encode(f.data.length.toString(8).padStart(11, '0') + '\0'), 124);
                header.set(new TextEncoder().encode(Math.floor(Date.now() / 1000).toString(8).padStart(11, '0') + '\0'), 136);
                header.set(new TextEncoder().encode("        "), 148);
                header[156] = 48;
                header.set(new TextEncoder().encode("ustar\000"), 257);
                let checksum = 0;
                for (let i = 0; i < 512; i++) checksum += header[i];
                header.set(new TextEncoder().encode(checksum.toString(8).padStart(6, '0') + '\0 '), 148);
                tar.set(header, offset);
                offset += 512;
                tar.set(f.data, offset);
                offset += Math.ceil(f.data.length / 512) * 512;
            }
            return tar;
        }

        document.getElementById('downloadBtn').addEventListener('click', async () => {
            if (!uploadedImageDataUrl) {
                alert("先に画像をアップロードしてね！");
                return;
            }

            const sX = document.getElementById('scaleX').value;
            const sY = document.getElementById('scaleY').value;
            const oX = document.getElementById('offsetX').value;
            const oY = document.getElementById('offsetY').value;

            const hexColor = document.getElementById('baseColor').value;
            const r = (parseInt(hexColor.slice(1, 3), 16) / 255).toFixed(3);
            const g = (parseInt(hexColor.slice(3, 5), 16) / 255).toFixed(3);
            const b = (parseInt(hexColor.slice(5, 7), 16) / 255).toFixed(3);

            const responseImg = await fetch(uploadedImageDataUrl);
            const imgBuffer = await responseImg.arrayBuffer();
            const imgUint8 = new Uint8Array(imgBuffer);

            const responseFbx = await fetch('./Tshirt.fbx');
            const fbxBuffer = await responseFbx.arrayBuffer();
            const fbxUint8 = new Uint8Array(fbxBuffer);

            const generateGUID = () => crypto.randomUUID().replace(/-/g, '');
            const texGuid = generateGUID();
            const matPrintGuid = generateGUID();
            const matBaseGuid = generateGUID();
            const fbxGuid = generateGUID();

            const textToUint8 = (text) => new TextEncoder().encode(text);

            const texMeta = `fileFormatVersion: 2\nguid: ${texGuid}\nTextureImporter:\n  serializedVersion: 12\n  textureType: 0\n  textureShape: 1\n  generateCubemap: 0\n  alphaIsTransparency: 1\n  isReadable: 1\n`;
            const matPrintMeta = `fileFormatVersion: 2\nguid: ${matPrintGuid}\nNativeFormatImporter:\n  mainObjectFileID: 2100000\n`;
            const matBaseMeta = `fileFormatVersion: 2\nguid: ${matBaseGuid}\nNativeFormatImporter:\n  mainObjectFileID: 2100000\n`;
            const fbxMeta = `fileFormatVersion: 2\nguid: ${fbxGuid}\nModelImporter:\n  serializedVersion: 202000\n  internalIDToNameTable: []\n`;

            // ★追加: Unity側で透過(Transparent)モードになるようにパラメータを追記
            const matPrintContent = `%YAML 1.1\n%TAG !u! tag:unity3d.com,2011:\n--- !u!21 &2100000\nMaterial:\n  serializedVersion: 8\n  m_Name: Mat_Print\n  m_Shader: {fileID: 46, guid: 0000000000000000f000000000000000, type: 0}\n  m_CustomRenderQueue: 3000\n  stringTagMap:\n    RenderType: Transparent\n  m_SavedProperties:\n    serializedVersion: 3\n    m_Floats:\n    - _Mode: 3\n    - _SrcBlend: 5\n    - _DstBlend: 10\n    - _ZWrite: 0\n    m_TexEnvs:\n    - _MainTex:\n        m_Texture: {fileID: 2800000, guid: ${texGuid}, type: 3}\n        m_Scale: {x: ${sX}, y: ${sY}}\n        m_Offset: {x: ${oX}, y: ${oY}}\n`;

            const matBaseContent = `%YAML 1.1\n%TAG !u! tag:unity3d.com,2011:\n--- !u!21 &2100000\nMaterial:\n  serializedVersion: 8\n  m_Name: Mat_Base\n  m_Shader: {fileID: 46, guid: 0000000000000000f000000000000000, type: 0}\n  m_SavedProperties:\n    serializedVersion: 3\n    m_Colors:\n    - _Color: {r: ${r}, g: ${g}, b: ${b}, a: 1}\n`;

            const basePath = "Assets/SorakazeHuuta/VRC-DressDrop";

            const files = [
                { name: `${texGuid}/asset`, data: imgUint8 },
                { name: `${texGuid}/asset.meta`, data: textToUint8(texMeta) },
                { name: `${texGuid}/pathname`, data: textToUint8(`${basePath}/CustomTexture.png`) },

                { name: `${matPrintGuid}/asset`, data: textToUint8(matPrintContent) },
                { name: `${matPrintGuid}/asset.meta`, data: textToUint8(matPrintMeta) },
                { name: `${matPrintGuid}/pathname`, data: textToUint8(`${basePath}/Mat_Print.mat`) },

                { name: `${matBaseGuid}/asset`, data: textToUint8(matBaseContent) },
                { name: `${matBaseGuid}/asset.meta`, data: textToUint8(matBaseMeta) },
                { name: `${matBaseGuid}/pathname`, data: textToUint8(`${basePath}/Mat_Base.mat`) },

                { name: `${fbxGuid}/asset`, data: fbxUint8 },
                { name: `${fbxGuid}/asset.meta`, data: textToUint8(fbxMeta) },
                { name: `${fbxGuid}/pathname`, data: textToUint8(`${basePath}/Tshirt.fbx`) }
            ];

            const tarBuffer = createTar(files);
            const gzBuffer = fflate.gzipSync(tarBuffer);

            const blob = new Blob([gzBuffer], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Custom_Tshirt_withModel.unitypackage";
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
