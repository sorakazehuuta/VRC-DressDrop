<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRC-DressDrop Generator</title>
    <!-- Three.js (3Dプレビュー用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 外部モデル読み込み用 (GLTFLoader) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- マウス操作用 (OrbitControls) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 30px; text-align: center; }
        .container { background: #fff; padding: 20px; border-radius: 10px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #preview { width: 100%; height: 400px; background: #333; margin: 20px 0; border-radius: 8px; overflow: hidden; }
        button { padding: 15px 30px; font-size: 16px; background: #000; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #333; }
        input[type="file"] { margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>VRC-DressDrop プレビュー版</h2>
        <p>1. テクスチャ画像を選択してね</p>
        <input type="file" id="imageUpload" accept="image/png, image/jpeg">

        <div id="preview"></div>

        <p>2. UnityPackageを生成</p>
        <button id="downloadBtn">ダウンロード</button>
    </div>

    <script>
        // --- 1. 3Dプレビューの設定 ---
        const container = document.getElementById('preview');
        const scene = new THREE.Scene();
        
        // コンテナのサイズに合わせてカメラを設定
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // ライトを追加 (少し明るく調整)
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(1, 1, 2);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x888888));

        // カメラをZ軸の2の位置まで近づける
        camera.position.set(0, 0, 2);
        
        let targetMaterial = null; // 後で画像を貼り付けるための変数
        const model = new THREE.Object3D(); // 親コンテナ
        scene.add(model);

        // GLBモデルの読み込み
        const loader = new THREE.GLTFLoader();
        loader.load('./Tshirt.glb', function(gltf) {
            const mesh = gltf.scene;
            
            // 画面に合わせてTシャツを大きくする
            mesh.scale.set(5, 5, 5); 
            mesh.position.set(0, -0.5, 0); // 大きくした分、少し下にずらす

            // 読み込んだモデルからマテリアルを探し出す
            mesh.traverse((child) => {
                if (child.isMesh) {
                    targetMaterial = child.material;
                    targetMaterial.color.setHex(0xffffff); // ベースを白に
                }
            });

            model.add(mesh);
        }, undefined, function(error) {
            console.error("モデルの読み込みエラー:", error);
        });

        // マウス操作（OrbitControls）の設定を追加
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 慣性をつけてヌルヌル動かす
        controls.dampingFactor = 0.05;

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // マウス操作を毎フレーム更新する
            renderer.render(scene, camera);
        }
        animate();

        // --- 2. 画像がアップロードされたら3Dに貼り付ける処理 ---
        let uploadedImageDataUrl = null;
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                uploadedImageDataUrl = event.target.result;
                const texLoader = new THREE.TextureLoader();
                texLoader.load(uploadedImageDataUrl, (texture) => {
                    // GLBモデル特有のテクスチャ上下反転を防ぐ処理
                    texture.flipY = false;
                    
                    if(targetMaterial) {
                        targetMaterial.map = texture;
                        targetMaterial.needsUpdate = true;
                    }
                });
            };
            reader.readAsDataURL(file);
        });

        // --- 3. ダウンロードボタンの処理 ---
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if(!uploadedImageDataUrl) {
                alert("先に画像をアップロードしてね！");
                return;
            }
            // ここにあとでfflateを使った本番のパッキング処理を入れる
            alert("ここにUnityPackageの書き出し処理が入るよ！");
        });
    </script>
</body>
</html>
