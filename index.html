<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRC-DressDrop Generator</title>
    <!-- Three.js (3Dプレビュー用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- パッキング用ライブラリ (gzip圧縮のfflateのみ残す) -->
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.0/umd/index.js"></script>

    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 30px; text-align: center; }
        .container { background: #fff; padding: 20px; border-radius: 10px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #preview { width: 100%; height: 400px; background: #333; margin: 20px 0; border-radius: 8px; overflow: hidden; }
        button { padding: 15px 30px; font-size: 16px; background: #000; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #333; }
        input[type="file"] { margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>VRC-DressDrop プレビュー版</h2>
        <p>1. テクスチャ画像を選択してね</p>
        <input type="file" id="imageUpload" accept="image/png, image/jpeg">

        <div id="preview"></div>

        <p>2. UnityPackageを生成</p>
        <button id="downloadBtn">ダウンロード</button>
    </div>

    <script>
        // --- 1. 3Dプレビューの設定 ---
        const container = document.getElementById('preview');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(1, 1, 2);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x888888));
        camera.position.set(0, 0, 2);
        
        let targetMaterial = null;
        const model = new THREE.Object3D();
        scene.add(model);

        const loader = new THREE.GLTFLoader();
        loader.load('./Tshirt.glb', function(gltf) {
            const mesh = gltf.scene;
            mesh.scale.set(5, 5, 5); 
            mesh.position.set(0, -0.5, 0);
            mesh.traverse((child) => {
                if (child.isMesh) {
                    targetMaterial = child.material;
                    targetMaterial.color.setHex(0xffffff);
                }
            });
            model.add(mesh);
        });

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 2. 画像がアップロードされたら3Dに貼り付ける処理 ---
        let uploadedImageDataUrl = null;
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                uploadedImageDataUrl = event.target.result;
                const texLoader = new THREE.TextureLoader();
                texLoader.load(uploadedImageDataUrl, (texture) => {
                    texture.flipY = false;
                    if(targetMaterial) {
                        targetMaterial.map = texture;
                        targetMaterial.needsUpdate = true;
                    }
                });
            };
            reader.readAsDataURL(file);
        });

        // --- TARファイルをブラウザ内で直接生成する自作関数 ---
        function createTar(files) {
            let blocks = 0;
            for (let f of files) blocks += 1 + Math.ceil(f.data.length / 512);
            blocks += 2; // 終端の空ブロック

            const tar = new Uint8Array(blocks * 512);
            let offset = 0;

            for (let f of files) {
                const header = new Uint8Array(512);
                header.set(new TextEncoder().encode(f.name).slice(0, 100), 0);
                header.set(new TextEncoder().encode("0000777\0"), 100);
                header.set(new TextEncoder().encode("0000000\0"), 108);
                header.set(new TextEncoder().encode("0000000\0"), 116);
                header.set(new TextEncoder().encode(f.data.length.toString(8).padStart(11, '0') + '\0'), 124);
                header.set(new TextEncoder().encode(Math.floor(Date.now() / 1000).toString(8).padStart(11, '0') + '\0'), 136);
                header.set(new TextEncoder().encode("        "), 148);
                header[156] = 48; // '0' (通常ファイル)
                header.set(new TextEncoder().encode("ustar\000"), 257);

                let checksum = 0;
                for (let i = 0; i < 512; i++) checksum += header[i];
                header.set(new TextEncoder().encode(checksum.toString(8).padStart(6, '0') + '\0 '), 148);

                tar.set(header, offset);
                offset += 512;
                tar.set(f.data, offset);
                offset += Math.ceil(f.data.length / 512) * 512;
            }
            return tar;
        }

        // --- 3. ダウンロードボタンの処理 (パッキングの心臓部) ---
        document.getElementById('downloadBtn').addEventListener('click', async () => {
            if(!uploadedImageDataUrl) {
                alert("先に画像をアップロードしてね！");
                return;
            }

            // 1. 画像データとFBXデータを取得してバイナリに変換
            const responseImg = await fetch(uploadedImageDataUrl);
            const imgBuffer = await responseImg.arrayBuffer();
            const imgUint8 = new Uint8Array(imgBuffer);

            const responseFbx = await fetch('./Tshirt.fbx');
            const fbxBuffer = await responseFbx.arrayBuffer();
            const fbxUint8 = new Uint8Array(fbxBuffer);

            // 2. Unity用の32桁のランダムなID(GUID)を生成
            const generateGUID = () => crypto.randomUUID().replace(/-/g, '');
            const texGuid = generateGUID();
            const matGuid = generateGUID();
            const fbxGuid = generateGUID(); 

            const textToUint8 = (text) => new TextEncoder().encode(text);

            // 3. メタデータ(設定ファイル)のテキストを錬成
            
            // テクスチャのメタデータ (textureShape: 1 を明示的に指定して2Dにする)
            const texMeta = `fileFormatVersion: 2\nguid: ${texGuid}\nTextureImporter:\n  internalIDToNameTable: []\n  externalObjects: {}\n  serializedVersion: 12\n  mipmaps:\n    mipMapMode: 0\n    enableMipMap: 1\n    sRGBTexture: 1\n    linearTexture: 0\n    fadeOut: 0\n    borderMipMap: 0\n    mipMapsPreserveCoverage: 0\n    alphaTestReferenceValue: 0.5\n    mipMapFadeDistanceStart: 1\n    mipMapFadeDistanceEnd: 3\n  bumpmap:\n    convertToNormalMap: 0\n    externalNormalMap: 0\n    heightScale: 0.25\n    normalMapFilter: 0\n  isReadable: 1\n  streamingMipmaps: 0\n  streamingMipmapsPriority: 0\n  vTOnly: 0\n  ignoreMasterTextureLimit: 0\n  grayScaleToAlpha: 0\n  generateCubemap: 6\n  cubemapConvolution: 0\n  seamlessCubemap: 0\n  textureFormat: 1\n  maxTextureSize: 2048\n  textureSettings:\n    serializedVersion: 2\n    filterMode: 1\n    aniso: 1\n    mipBias: 0\n    wrapU: 0\n    wrapV: 0\n    wrapW: 0\n  nPOTScale: 1\n  lightmap: 0\n  compressionQuality: 50\n  spriteMode: 0\n  spriteExtrude: 1\n  spriteMeshType: 1\n  alignment: 0\n  spritePivot: {x: 0.5, y: 0.5}\n  spritePixelsToUnits: 100\n  spriteBorder: {x: 0, y: 0, z: 0, w: 0}\n  spriteGenerateFallbackPhysicsShape: 1\n  alphaUsage: 1\n  alphaIsTransparency: 0\n  spriteTessellationDetail: -1\n  textureType: 0\n  textureShape: 1\n  singleChannelComponent: 0\n  flipbookRows: 1\n  flipbookColumns: 1\n  maxTextureSizeSet: 0\n  compressionQualitySet: 0\n  textureFormatSet: 0\n  ignorePngGamma: 0\n  applyGammaDecoding: 0\n  swizzle: 50462976\n`;
            
            const matMeta = `fileFormatVersion: 2\nguid: ${matGuid}\nNativeFormatImporter:\n  mainObjectFileID: 2100000\n`;
            const fbxMeta = `fileFormatVersion: 2\nguid: ${fbxGuid}\nModelImporter:\n  serializedVersion: 202000\n  internalIDToNameTable: []\n`;
            
            // マテリアルの中身 (m_Name をファイル名と同じ CustomMaterial に統一)
            const matContent = `%YAML 1.1\n%TAG !u! tag:unity3d.com,2011:\n--- !u!21 &2100000\nMaterial:\n  m_Name: CustomMaterial\n  m_Shader: {fileID: 46, guid: 0000000000000000f000000000000000, type: 0}\n  m_SavedProperties:\n    m_TexEnvs:\n    - _MainTex:\n        m_Texture: {fileID: 2800000, guid: ${texGuid}, type: 3}\n`;

            const basePath = "Assets/SorakazeHuuta/VRC-DressDrop";

            // 4. 梱包するファイルのリストにFBXを追加
            const files = [
                { name: `${texGuid}/asset`, data: imgUint8 },
                { name: `${texGuid}/asset.meta`, data: textToUint8(texMeta) },
                { name: `${texGuid}/pathname`, data: textToUint8(`${basePath}/CustomTexture.png`) },
                
                { name: `${matGuid}/asset`, data: textToUint8(matContent) },
                { name: `${matGuid}/asset.meta`, data: textToUint8(matMeta) },
                { name: `${matGuid}/pathname`, data: textToUint8(`${basePath}/CustomMaterial.mat`) },

                { name: `${fbxGuid}/asset`, data: fbxUint8 },
                { name: `${fbxGuid}/asset.meta`, data: textToUint8(fbxMeta) },
                { name: `${fbxGuid}/pathname`, data: textToUint8(`${basePath}/Tshirt.fbx`) }
            ];

            // 5. 自作関数でTAR形式にまとめてから、gzip(fflate)で圧縮する
            const tarBuffer = createTar(files);
            const gzBuffer = fflate.gzipSync(tarBuffer);

            // 6. ブラウザ上でダウンロードを発火
            const blob = new Blob([gzBuffer], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Custom_Tshirt_withModel.unitypackage";
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
