<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRC-DressDrop Generator</title>
    <!-- Three.js (3Dプレビュー用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- ↓ここを追加！ パッキング用ライブラリ (圧縮とtar化) -->
    <script src="https://cdn.jsdelivr.net/npm/tinytar@0.1.1/dist/tinytar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.0/umd/index.js"></script>

    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 30px; text-align: center; }
        .container { background: #fff; padding: 20px; border-radius: 10px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #preview { width: 100%; height: 400px; background: #333; margin: 20px 0; border-radius: 8px; overflow: hidden; }
        button { padding: 15px 30px; font-size: 16px; background: #000; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #333; }
        input[type="file"] { margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>VRC-DressDrop プレビュー版</h2>
        <p>1. テクスチャ画像を選択してね</p>
        <input type="file" id="imageUpload" accept="image/png, image/jpeg">

        <div id="preview"></div>

        <p>2. UnityPackageを生成</p>
        <button id="downloadBtn">ダウンロード</button>
    </div>

    <script>
        // --- 1. 3Dプレビューの設定 ---
        const container = document.getElementById('preview');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(1, 1, 2);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x888888));
        camera.position.set(0, 0, 2);
        
        let targetMaterial = null;
        const model = new THREE.Object3D();
        scene.add(model);

        const loader = new THREE.GLTFLoader();
        loader.load('./Tshirt.glb', function(gltf) {
            const mesh = gltf.scene;
            mesh.scale.set(5, 5, 5); 
            mesh.position.set(0, -0.5, 0);
            mesh.traverse((child) => {
                if (child.isMesh) {
                    targetMaterial = child.material;
                    targetMaterial.color.setHex(0xffffff);
                }
            });
            model.add(mesh);
        });

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 2. 画像がアップロードされたら3Dに貼り付ける処理 ---
        let uploadedImageDataUrl = null;
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                uploadedImageDataUrl = event.target.result;
                const texLoader = new THREE.TextureLoader();
                texLoader.load(uploadedImageDataUrl, (texture) => {
                    texture.flipY = false;
                    if(targetMaterial) {
                        targetMaterial.map = texture;
                        targetMaterial.needsUpdate = true;
                    }
                });
            };
            reader.readAsDataURL(file);
        });

        // --- 3. ダウンロードボタンの処理 (パッキングの心臓部) ---
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if(!uploadedImageDataUrl) {
                alert("先に画像をアップロードしてね！");
                return;
            }

            // 1. 画像データをバイナリ(Uint8Array)に変換
            const imgData = atob(uploadedImageDataUrl.split(',')[1]);
            const imgUint8 = new Uint8Array(imgData.length);
            for (let i = 0; i < imgData.length; i++) {
                imgUint8[i] = imgData.charCodeAt(i);
            }

            // 2. Unity用の32桁のランダムなID(GUID)を生成
            const generateGUID = () => crypto.randomUUID().replace(/-/g, '');
            const texGuid = generateGUID();
            const matGuid = generateGUID();

            const textToUint8 = (text) => new TextEncoder().encode(text);

            // 3. メタデータ(設定ファイル)のテキストを錬成
            const texMeta = `fileFormatVersion: 2\nguid: ${texGuid}\nTextureImporter:\n  isReadable: 1\n  mipmapEnabled: 1\n`;
            const matMeta = `fileFormatVersion: 2\nguid: ${matGuid}\nNativeFormatImporter:\n  mainObjectFileID: 2100000\n`;
            
            // アップロードされた画像のGUIDを組み込んだマテリアルデータ
            const matContent = `%YAML 1.1\n%TAG !u! tag:unity3d.com,2011:\n--- !u!21 &2100000\nMaterial:\n  m_Name: Custom_Tshirt_Mat\n  m_Shader: {fileID: 46, guid: 0000000000000000f000000000000000, type: 0}\n  m_SavedProperties:\n    m_TexEnvs:\n    - _MainTex:\n        m_Texture: {fileID: 2800000, guid: ${texGuid}, type: 3}\n`;

            // 4. Unityエディタ内で展開されるフォルダ階層を指定
            const basePath = "Assets/SorakazeHuuta/VRC-DressDrop";

            // 5. 梱包するファイルのリストを作成
            const files = [
                { name: `${texGuid}/asset`, data: imgUint8 },
                { name: `${texGuid}/asset.meta`, data: textToUint8(texMeta) },
                { name: `${texGuid}/pathname`, data: textToUint8(`${basePath}/CustomTexture.png`) },
                
                { name: `${matGuid}/asset`, data: textToUint8(matContent) },
                { name: `${matGuid}/asset.meta`, data: textToUint8(matMeta) },
                { name: `${matGuid}/pathname`, data: textToUint8(`${basePath}/CustomMaterial.mat`) }
            ];

            // 6. tar形式にまとめてから、gzip(fflate)で圧縮する
            const tarBuffer = tinytar.tar(files);
            const gzBuffer = fflate.gzipSync(tarBuffer);

            // 7. ブラウザ上でダウンロードを発火
            const blob = new Blob([gzBuffer], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Custom_Tshirt.unitypackage";
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
